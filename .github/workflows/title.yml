name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            BREAKING
            feat
            fix
            docs
            refactor
            perf
            test
            ci
            chore
            revert
          scopes: |
            _tools
            builder
            common
            config
            context
            convert
            i18n
            logging
            reactivity
            realcss
            realdom
            router
            rpc
            templater
