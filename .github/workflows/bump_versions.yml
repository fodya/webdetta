name: bump versions

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: Branch to bump and push to
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TARGET_BRANCH: ${{ inputs.branch || (startsWith(github.ref, 'refs/tags/') && 'main' || github.ref_name) }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Bump versions
        run: |
          git fetch --tags origin
          deno eval 'import { bumpWorkspaces } from "jsr:@deno/bump-workspaces@^0.1"; await bumpWorkspaces({ importMap: "deno.json", dryRun: "git" });'

      - name: Commit version bump
        run: |
          if git diff --quiet; then
            echo "No version changes"
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump versions [skip ci]"
          git push origin HEAD:${{ env.TARGET_BRANCH }}
