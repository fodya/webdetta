name: version_bump
permissions:
  contents: write
  pull-requests: write
on: workflow_dispatch
jobs:
  build:
    name: version bump
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Run version bump
        id: bump
        run: |
          echo "snapshot_tag=snapshot-$(date -u +%Y-%m-%d-%H-%M-%S)" >> "$GITHUB_OUTPUT"
          git fetch --unshallow origin
          deno run -A jsr:@deno/bump-workspaces@^0.1/cli --import-map deno.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ github.actor }}
          GIT_USER_EMAIL: ${{ github.actor}}@users.noreply.github.com

      - name: Push Snapshot tag
        run: |
          branch="$(git branch --show-current)"
          if [[ "$branch" != release-* ]]; then
            echo "No release branch created; skipping Snapshot tag."
            exit 0
          fi
          git tag "${{ steps.bump.outputs.snapshot_tag }}"
          git push origin "${{ steps.bump.outputs.snapshot_tag }}"
